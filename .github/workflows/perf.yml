name: perf

# The 10 000-object paint budget is a separate signal, not a PR gate. A shared GitHub
# runner measured 17.3 ms against the 16 ms budget, while the same test passes on a quiet
# host; putting it in front of every PR blocked unrelated work. This workflow runs it on
# main, nightly, by the `perf` label or on demand. Move it to a dedicated quiet runner
# when one exists; do not use a self-hosted runner for fork PRs.
on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf-scale:
    if: github.event_name != 'pull_request' || github.event.label.name == 'perf'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remo_test
          POSTGRES_PASSWORD: remo_test
          POSTGRES_DB: remo_test_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remo_test -d remo_test_control"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REMO_TEST_POSTGRES_URL: postgres://remo_test:remo_test@127.0.0.1:5432/remo_test_control
      REMO_METRICS: "off"
      PLAYWRIGHT_VERSION: "1.64.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # The scale scenario starts the same sync/web servers and a dedicated test database
      # as the ordinary e2e run; install and prove the environment identity first.
      - name: Test PostgreSQL identity
        run: |
          pnpm test:db:init
          pnpm test:db:check

      - name: 10 000-object paint budget
        run: pnpm e2e:perf-scale

      - name: Upload browser evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perf-scale-${{ github.run_id }}
          path: |
            test-results/
            e2e-report/
          retention-days: 7
