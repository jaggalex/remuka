name: Signed support knowledge
on:
  workflow_dispatch:
    inputs:
      release:
        description: Product release deployed with this commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    environment: knowledge-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm guide:build && pnpm guide:check && pnpm docs:check
      - name: Sign the reviewed documentation
        env:
          REMO_VERSION: ${{ inputs.release }}
          ED25519_PEM: ${{ secrets.SUPPORT_KNOWLEDGE_SIGNING_KEY }}
        run: |
          umask 077
          key=$(mktemp "$RUNNER_TEMP/knowledge-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$ED25519_PEM" > "$key"
          unset ED25519_PEM
          SUPPORT_KNOWLEDGE_SIGNING_KEY_FILE="$key" pnpm guide:knowledge "$RUNNER_TEMP/knowledge"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: support-knowledge-${{ github.sha }}
          path: ${{ runner.temp }}/knowledge/
          if-no-files-found: error
