# The test stand's edge: one machine, two zones, basic auth (ADR-261, spec/stage.md §4.1).
#
# Four names are substituted before `nginx -t`:
#
#   STAGE_SUFFIX   stage.remuka.ru    the zone's stand apex; app./docs./mail. prefix it
#   WEB_ALIAS      stage-ru-web       the web container's alias in the shared `edge` network
#   MAIL_ALIAS     stage-ru-mail      the Mailpit container's alias in the same network
#   LEGAL_ZONE     ru                 which `legal-site/<zone>/` this installation serves
#
# The application publishes no ports and the web container serves the app, `/api/`,
# `/sync/` and the guide, so this edge only decides who may pass and what search engines
# may see. The app and guide security policies (CSP, HSTS, framing) are sent by the web
# container itself (`deploy/nginx.container.conf`); this file adds no second copy, which
# would duplicate every header. It does add `X-Robots-Tag` and the disallowing robots file.
#
# One SAN certificate per zone, named after the apex, covers the four hosts; the live
# directory is `live/STAGE_SUFFIX/`. HTTP-01 is answered from `/var/www/certbot`, so a
# renewal needs only a running nginx, not a stopped one.
#
# `http2 on;` needs nginx 1.25.1 or newer. The stand runs the `nginx:1.28-alpine` image;
# a distribution package older than that must use `listen 443 ssl http2` instead.
#
# Basic auth covers every host. Exactly two paths are open on the application host:
#   /api/billing/webhooks/  provider callbacks: the provider cannot send a password and
#                           the handler verifies the signature (ADR-248)
#   /api/health             release.sh checks the active commit and schema after a deploy
# `/mcp` and the agent routes stay behind basic auth: external clients are not needed on
# a stand. If one is ever needed, that is a decision, not a line in this file.
#
# Run nginx in a container attached to the `edge` network; its configuration directory
# holds this file, `/etc/nginx/stage.htpasswd` and the certificates. HTTP-01 renewals are
# answered from `/var/www/certbot`, shared with the certbot container.
#
# The redirect to the application is 302, as on the production apex: the address is not a
# permanent destination (spec/rebrand-acceptance.md §0).

# Plain HTTP for every host on the stand: answer the ACME challenge, otherwise upgrade.
server {
    listen 80;
    listen [::]:80;
    server_name STAGE_SUFFIX app.STAGE_SUFFIX docs.STAGE_SUFFIX mail.STAGE_SUFFIX;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================================
# STAGE_SUFFIX — the stand apex, a doorway to the application
# ============================================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name STAGE_SUFFIX;

    ssl_certificate     /etc/letsencrypt/live/STAGE_SUFFIX/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/STAGE_SUFFIX/privkey.pem;

    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    auth_basic "Ремука — тестовый стенд";
    auth_basic_user_file /etc/nginx/stage.htpasswd;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        auth_basic off;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        return 302 https://app.STAGE_SUFFIX$request_uri;
    }
}

# ============================================================================
# app.STAGE_SUFFIX — the application
# ============================================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.STAGE_SUFFIX;

    ssl_certificate     /etc/letsencrypt/live/STAGE_SUFFIX/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/STAGE_SUFFIX/privkey.pem;

    server_tokens off;
    client_max_body_size 4m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    auth_basic "Ремука — тестовый стенд";
    auth_basic_user_file /etc/nginx/stage.htpasswd;

    # The only two open paths. The prefix match keeps the path unchanged: the web
    # container strips `/api` when it proxies to sync.
    location = /api/health {
        auth_basic off;
        proxy_pass http://WEB_ALIAS:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    location /api/billing/webhooks/ {
        auth_basic off;
        proxy_pass http://WEB_ALIAS:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # The live document. A browser sends the credentials it already used for this origin
    # on the socket request too; §4.1 asks for a check in Chrome, Firefox and Safari, and
    # only if one of them does not, this location gets `auth_basic off` — the socket
    # still requires a session cookie.
    location /sync/ {
        proxy_pass http://WEB_ALIAS:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Legal documents are static pages built by `pnpm legal:build` (ADR-256), as on the
    # production host. The instance keeps only its own zone; the edge mounts the stand's
    # legal directory at `/srv/legal` read-only. They stay behind basic auth.
    location /legal/ {
        alias /srv/legal/LEGAL_ZONE/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Everything else, including `/api/`, `/mcp` and the agent routes: basic auth applies.
    location / {
        proxy_pass http://WEB_ALIAS:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ============================================================================
# docs.STAGE_SUFFIX — the product guide
# ============================================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docs.STAGE_SUFFIX;

    ssl_certificate     /etc/letsencrypt/live/STAGE_SUFFIX/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/STAGE_SUFFIX/privkey.pem;

    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    auth_basic "Ремука — тестовый стенд";
    auth_basic_user_file /etc/nginx/stage.htpasswd;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        auth_basic off;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # The root is a doorway: the guide lives under `/guide/`, as in `nginx-docs.conf`.
    location = / {
        return 302 /guide/;
    }

    # The web container's second listener serves the built guide from `/srv/docs/`.
    location /guide/ {
        proxy_pass http://WEB_ALIAS:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}

# ============================================================================
# mail.STAGE_SUFFIX — the Mailpit inbox
# ============================================================================
#
# Mailpit is a test tool: no session of its own, so the stand password is the only gate.
# The application policy is not included here, because the inbox is not the application
# and its own UI script would be blocked.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.STAGE_SUFFIX;

    ssl_certificate     /etc/letsencrypt/live/STAGE_SUFFIX/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/STAGE_SUFFIX/privkey.pem;

    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    auth_basic "Ремука — тестовый стенд";
    auth_basic_user_file /etc/nginx/stage.htpasswd;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        auth_basic off;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://MAIL_ALIAS:8025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The inbox streams new messages; a buffered stream would arrive in chunks.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
