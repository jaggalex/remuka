# support.<domain> on a test stand: the static widget page the app frames, and Chatwoot.
#
# Copy to /srv/stage-nginx/conf.d/support.conf after replacing the two placeholders:
#   __APP_ORIGIN__   https://app.stage.remuka.ru
#   __SUPPORT_HOST__ support.stage.remuka.ru
#
# The stand's Caddy terminates TLS and forwards this host to the stage ingress; this block
# listens on 8080 like the other stage vhosts. Basic auth is off here because the widget is
# framed cross-origin (an iframe cannot inherit the stand password) and is useless anyway:
# every conversation is bound to a signed identity. The operator app under /app keeps the
# stand password.

map $http_upgrade $support_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name __SUPPORT_HOST__;
    server_tokens off;
    client_max_body_size 25m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /widget.html {
        root /srv/static/support;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors __APP_ORIGIN__" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /widget.js {
        root /srv/static/support;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Operators only: the same stand password as the app, docs and mail hosts.
    location ^~ /app {
        auth_basic "Ремука — тестовый стенд";
        auth_basic_user_file /etc/nginx/stage.htpasswd;
        proxy_pass http://stage-chatwoot:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chatwoot itself: the widget API, SDK assets and the action-cable socket.
    location / {
        proxy_pass http://stage-chatwoot:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $support_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
