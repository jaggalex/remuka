# app.remuka.ru — the Russia-region stub (spec/rebrand-fixes.md §2).
#
# The region does not exist yet, and this host must not lead anyone into the EU cloud
# while looking like the Russian one. It therefore serves one static page for every path
# with code 200: no `proxy_pass`, no `return 301`, no application, no redirect to .com.
# The only way out is the explicit link on the page, which says which cloud it opens.
#
# Both listeners answer the same page on purpose. The page has no forms, no session and
# nothing to protect, so an HTTP request is answered rather than redirected; HSTS from the
# shared snippet still upgrades a browser that has visited it over TLS.
#
# Include from the host's http context (the shipped setup keeps one file per host):
#
#   include /srv/remo/deploy/ru-stub/nginx.conf;
#
# Replace REPLACE_WITH_CERT_DIR with the directory that holds the certificate for
# app.remuka.ru; this page has no session, but the host still needs TLS.

server {
    listen 80;
    listen [::]:80;
    server_name app.remuka.ru;

    root /srv/remo/deploy/ru-stub;
    index index.html;

    server_tokens off;
    include /srv/remo/deploy/nginx-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Any path is the same page, and robots.txt is the one real file beside it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.remuka.ru;

    ssl_certificate     REPLACE_WITH_CERT_DIR/app.remuka.ru/fullchain.pem;
    ssl_certificate_key REPLACE_WITH_CERT_DIR/app.remuka.ru/privkey.pem;

    root /srv/remo/deploy/ru-stub;
    index index.html;

    server_tokens off;
    include /srv/remo/deploy/nginx-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Any path is the same page, and robots.txt is the one real file beside it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
