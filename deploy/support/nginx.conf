# The operator's static widget page (ADR-250, spec/support.md §2.2).
#
# This block serves exactly two files and nothing else: `widget.html` and `widget.js`.
# Chatwoot itself keeps its own server block; if both live on `support.<domain>`, copy the
# `location ~ ^/(widget\.html|widget\.js)$` block and its headers into the Chatwoot vhost
# and leave Chatwoot's `/widget`, `/packs/`, `/api/` and `/cable` locations alone.
#
# `__REMO_APP_ORIGIN__` is replaced with the app origin from `REMO_APP_ORIGIN`
# (for example `https://boards.example.com`). It must be the same value as the
# `remo-app-origin` meta tag in widget.html — the header and the page must agree.

server {
    listen 80;
    listen [::]:80;
    server_name support.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name support.example.com;

    ssl_certificate     /etc/letsencrypt/live/support.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.example.com/privkey.pem;

    root /srv/remo-support;
    server_tokens off;

    # Only the two files. `widget.js` loads the Chatwoot SDK from this same origin
    # (`/packs/js/sdk.js`), which is why `script-src 'self'` is enough. If Chatwoot lives
    # on another origin, add that origin to `script-src` and `frame-src` and set
    # `chatwoot-base-url` in widget.html to it.
    #
    # `frame-ancestors` names exactly the app origin: one page may frame this one, and the
    # page cannot be embedded anywhere else. X-Frame-Options is deliberately absent —
    # `DENY` or `SAMEORIGIN` would block the app's iframe before CSP is even consulted.
    #
    # `style-src 'unsafe-inline'` covers the page's small layout block; there is no inline
    # script, so `script-src` stays strict.
    location ~ ^/(widget\.html|widget\.js)$ {
        try_files $uri =404;

        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors __REMO_APP_ORIGIN__" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Not a static file server: anything else belongs to the Chatwoot vhost.
    location / {
        return 404;
    }
}
