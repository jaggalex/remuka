# The product guide on its own host (ADR-254, spec/cloud-zones.md §4.1).
#
# One name is substituted before `nginx -t`:
#
#   DOCS_HOST   docs.remuka.com   the guide of this installation
#
# The same file serves the EU host and `docs.remuka.ru`: the guide is one static site, and
# every page names `docs.remuka.com` as its canonical address (`scripts/guide-build.mjs`),
# so search engines see one page rather than two. The application keeps its own `/guide/`
# block in `nginx-remo.conf`; a self-host without a separate documentation host needs only
# that block and not this file.
#
# The guide is static: `pnpm guide:build` writes `docs-site/`, and this host serves it
# under `/guide/` (`llms.txt` and `llms-full.txt` sit there too, next to the pages).

server {
    listen 80;
    listen [::]:80;
    server_name docs.remuka.com;
    return 301 https://docs.remuka.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.remuka.com;

    ssl_certificate     /etc/letsencrypt/live/docs.remuka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.remuka.com/privkey.pem;

    server_tokens off;

    # The root is a doorway, not a page: the guide lives under `/guide/`. Temporary, for
    # the same reason as the apex: this address is not going away.
    location = / {
        return 302 /guide/;
    }

    # The same block as in `nginx-remo.conf`: the files are built for this prefix.
    location /guide/ {
        alias /srv/remo/docs-site/;
        index index.html;
        try_files $uri $uri/ =404;
        # The guide has its own policy: one hashed inline script (ADR-172).
        include /srv/remo/deploy/nginx-security-headers-docs.conf;
    }

    # Nothing else is published on the documentation host.
    location / {
        return 404;
    }
}
