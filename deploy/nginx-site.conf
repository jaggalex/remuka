# The apex site and its `www` host for one installation (ADR-254, spec/cloud-zones.md §4.1).
#
# Two names are substituted before `nginx -t`:
#
#   SITE_HOST   remuka.com       the apex: the landing page lives here when it exists
#   APP_HOST    app.remuka.com   the application of the same installation
#
# This file is used on both installations with its own pair: `remuka.com` + `app.remuka.com`
# in the EU, `remuka.ru` + `app.remuka.ru` in Russia. The installations do not know each
# other, so this file never names the other zone's host.
#
# While the landing page does not exist, the apex answers **302**, not 301/308: room links
# already shared as `<apex>/r/…` must still open the room, and a permanent redirect would be
# remembered by every browser until each person clears site data (spec/cloud-zones.md §1.2).
# `www` is the one address that changes for good, so it answers 301.

# SITE_HOST over plain HTTP: one hop to the HTTPS apex.
server {
    listen 80;
    listen [::]:80;
    server_name remuka.com;
    return 301 https://remuka.com$request_uri;
}

# www over plain HTTP: straight to the HTTPS apex, not through the apex redirect below.
server {
    listen 80;
    listen [::]:80;
    server_name www.remuka.com;
    return 301 https://remuka.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name remuka.com;

    ssl_certificate     /etc/letsencrypt/live/remuka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remuka.com/privkey.pem;

    server_tokens off;

    # The body is empty, but the headers are what a browser keeps for the next year (ADR-172).
    include /srv/remo/deploy/nginx-security-headers.conf;

    # Legal documents are part of the site, not of the application: a person reads the
    # offer before an account exists (ADR-256). The installation serves its own zone;
    # on the Russian server this directory is `legal-site/ru/`.
    location /legal/ {
        alias /srv/remo/legal-site/eu/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Temporary on purpose: see the top of this file. `$request_uri` keeps path and query,
    # so `/r/<room>?x=1` still opens that room on the application host.
    location / {
        return 302 https://app.remuka.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.remuka.com;

    ssl_certificate     /etc/letsencrypt/live/www.remuka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.remuka.com/privkey.pem;

    server_tokens off;

    include /srv/remo/deploy/nginx-security-headers.conf;

    # The only permanent redirect in this file: `www` is the same site under another name.
    location / {
        return 301 https://remuka.com$request_uri;
    }
}
