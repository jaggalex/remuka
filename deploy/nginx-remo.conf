# Ремука / remo behind nginx: the application, the integration address and the move
# away from the old host.
#
# An example for an installation that is changing its public address (ADR-254,
# `spec/rebrand.md` §5–6). Copy it, replace every `REPLACE_WITH_...` value, run
# `nginx -t`, reload. A fresh installation that never moves can delete the old-host
# section at the end.
#
# This file owns five groups of hosts:
#   app.remuka.com        application: web, sync, /api/, /mcp and the /sync/ socket
#   app.remuka.ru         the Russian installation; while it is not built,
#                         deploy/ru-stub/ answers every path with 200 and never sends
#                         a browser to the EU cloud
#   api.remuka.com/.ru    integration address: /api/ is proxied to sync, no redirect
#   remo.letii.ru         the old application host: pages 301, API/MCP/socket proxied
#   docs.remo.letii.ru    the old guide host: 301 to docs.remuka.com
#
# The other public hosts have their own files, because a landing page and the guide
# have their own cache and CSP:
#   remuka.com/.ru, www.*   deploy/nginx-site.conf — the apex and its www host
#   docs.remuka.com         deploy/nginx-docs.conf — the guide
# The apex answers 302 to the application of its zone until a landing exists;
# `www` answers 301 to the apex. Neither is ever 308: a permanent redirect is cached
# in every browser and can only be undone by each visitor (`spec/rebrand.md` §11.6,
# `spec/rebrand-acceptance.md` §0).
#
# Certificates. Every name needs one, including the hosts handled by the other two
# files: a host that answers without a certificate looks like a break-in, not like a
# redirect. One certificate per name or one SAN certificate covering all of them.
#
#   remuka.com, www.remuka.com            deploy/nginx-site.conf
#   remuka.ru, www.remuka.ru              deploy/nginx-site.conf
#   app.remuka.com, app.remuka.ru         this file
#   api.remuka.com, api.remuka.ru         this file
#   docs.remuka.com                       deploy/nginx-docs.conf
#   remo.letii.ru, docs.remo.letii.ru     this file, kept for at least twelve months
#
# The Russian installation certifies its own hosts on its own server and keeps the
# `app.remuka.ru` block below, which includes the stub until the region exists.
#
# Redirect policy:
#   301 only where the address never comes back: the old application pages, the old
#       guide, and `www` (the same site under another name).
#   302 for a decision that is still temporary: the apex without a landing and the
#       Russian application. A 308 is permanent and browsers remember it; it is safe
#       only after the change is final (`spec/rebrand-acceptance.md` §0).
#   API, MCP and the socket are never redirected: an HTTP client does not carry
#       `Authorization` across hosts, and a browser cannot follow a redirect on an
#       open socket. They are proxied and marked deprecated instead.
#
# nginx 1.25.1 and newer prefer `http2 on;`. The older `listen … http2` form is kept
# below because distribution packages (Debian, Ubuntu) still ship older nginx.

# ============================================================================
# app.remuka.com — the application
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name app.remuka.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.remuka.com;

    ssl_certificate     REPLACE_WITH_CERT_DIR/app.remuka.com/fullchain.pem;
    ssl_certificate_key REPLACE_WITH_CERT_DIR/app.remuka.com/privkey.pem;

    root /srv/remo/apps/web/dist;
    index index.html;

    # Security headers (ADR-172). Repeated in every location that sets its own header,
    # because nginx does not inherit `add_header` into such a location.
    #
    # With REMO_SUPPORT_PROVIDER=chatwoot, replace this path with the file rendered by
    # `render_support_headers` (deploy/config.sh); that variant adds `frame-src` for the
    # one support origin. `none` and `link` keep this base file unchanged (ADR-250).
    include /srv/remo/deploy/nginx-security-headers.conf;

    # Board metadata is small; the document itself travels over the socket.
    client_max_body_size 4m;
    server_tokens off;

    # Metrics are for the machine, not the internet.
    location = /api/metrics {
        return 404;
    }

    # Accounts, organisations, sharing. The trailing slash in proxy_pass strips /api.
    location /api/ {
        proxy_pass http://127.0.0.1:1234/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # MCP over HTTP is the same sync process. It stays on the application host, where
    # the client already has an address and a token (spec/rebrand.md §5).
    location ^~ /mcp {
        proxy_pass http://127.0.0.1:1234;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Live document: /sync/<room>. The service takes the room from the stripped path.
    location /sync/ {
        proxy_pass http://127.0.0.1:1234/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Legal documents are static pages built by `pnpm legal:build` (ADR-256). The
    # installation serves its own zone only: `legal-site/eu/` on the EU server,
    # `legal-site/ru/` on the Russian one. The same mapping is in `nginx-site.conf`
    # for the apex, because a person reads a document before signing in.
    location /legal/ {
        alias /srv/remo/legal-site/eu/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # The product guide is a static site built by `pnpm guide:build` (ADR-099).
    # docs.remuka.com is the canonical address; this copy keeps a single-host
    # self-host installation working, because it has no separate docs host.
    location /guide/ {
        alias /srv/remo/docs-site/;
        index index.html;
        try_files $uri $uri/ =404;
        # The guide has its own policy: one hashed inline script (ADR-172).
        include /srv/remo/deploy/nginx-security-headers-docs.conf;
    }

    # Vite emits content-hashed file names; they can be cached forever.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /srv/remo/deploy/nginx-security-headers.conf;
        try_files $uri =404;
    }

    # The operator console (ADR-259 §5, spec/operator.md §5). The same SPA shell answers,
    # so a deploy still reaches the open tab, but the page is never an index entry: it
    # names customers, and `robots.txt` below is only a request. Access itself is decided
    # by the service, which answers `404` to anyone without the role.
    #
    # The shell is served as a file, not by `try_files $uri /index.html`: a URI fallback is
    # an internal redirect, nginx re-runs the request in `location /`, and this block's
    # `X-Robots-Tag` would be dropped. Nothing but the shell lives under `/operator/`.
    location = /operator {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /srv/remo/deploy/nginx-security-headers.conf;
        try_files /index.html =404;
    }

    location /operator/ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /srv/remo/deploy/nginx-security-headers.conf;
        try_files /index.html =404;
    }

    # The SPA shell must be revalidated, or a deploy leaves old tabs on old bundles.
    location / {
        add_header Cache-Control "no-cache";
        include /srv/remo/deploy/nginx-security-headers.conf;
        try_files $uri /index.html;
    }

}

# ============================================================================
# app.remuka.ru — the Russian installation
# ============================================================================
#
# The region is a separate installation with its own database (spec/rebrand.md
# §5.1), so this address must never proxy to the EU cloud and must never redirect
# there. Until that installation is built, `deploy/ru-stub/` answers every path with
# code 200: a static page, `noindex`, and one explicit link. On the Russian server
# this include is replaced by a copy of the `app.remuka.com` server block above with
# `server_name app.remuka.ru`, its own upstream and its own REMO_APP_ORIGIN.
include /srv/remo/deploy/ru-stub/nginx.conf;

# ============================================================================
# api.remuka.com / api.remuka.ru — the integration address
# ============================================================================
#
# DNS for both names already answers on the application hosts, so both need a real
# answer and a certificate. There is no page here and no redirect: an HTTP client
# does not carry `Authorization` to another host, so `/api/` is proxied and an
# integration token keeps working. Everything else is 404 rather than a redirect into
# the app. One certificate must cover both names, or split the block per installation.

server {
    listen 80;
    listen [::]:80;
    server_name api.remuka.com api.remuka.ru;
    # Same host on purpose: an API client that used http retries against the API, not
    # against a page on another host (where `Authorization` would be dropped).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.remuka.com api.remuka.ru;

    ssl_certificate     REPLACE_WITH_CERT_DIR/api.remuka.com/fullchain.pem;
    ssl_certificate_key REPLACE_WITH_CERT_DIR/api.remuka.com/privkey.pem;

    server_tokens off;
    include /srv/remo/deploy/nginx-security-headers.conf;

    client_max_body_size 4m;

    location = /api/metrics {
        return 404;
    }

    # Accounts, organisations, sharing. The trailing slash in proxy_pass strips /api.
    location /api/ {
        proxy_pass http://127.0.0.1:1234/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The API host has no UI and no pages. 404, not 301: a redirect is the failure
    # mode this host exists to avoid.
    location / {
        return 404;
    }
}

# ============================================================================
# Moving the application to a new address (ADR-254, spec/rebrand.md §6)
# ============================================================================
#
# This section belongs to one deployment that is changing its public address: the
# application block above is the *new* host (`server_name app.remuka.com;` in the
# cloud), and everything below keeps the old host answering during the move. A
# self-host installation that is not moving can delete the whole section.
#
# Three kinds of traffic need three answers:
#
#   pages     301 with the same path and query — bookmarks, room links, public
#             links, the help pages;
#   API/MCP   proxied, not redirected: a POST does not always survive a 301 and
#             integration tokens and MCP clients are configured with the old
#             address. `Deprecation` and `Link` tell them to move;
#   socket    proxied; a browser cannot follow a redirect on an open socket, so
#             the sync service closes it with `4001 moved` once the client should
#             move (REMO_APP_ORIGIN_MOVED + REMO_APP_ORIGIN_ALIASES).
#
# The old host answers for at least twelve months. Keep the certificate for it.
# The server-side `Deprecation` header also covers callers that reach sync
# directly; here it names the full path, which the service cannot see after the
# proxy strips `/api`.

server {
    listen 80;
    listen [::]:80;
    server_name remo.letii.ru;
    # Upgrade on the same host, not straight to the new one: an API client that used
    # http must reach the API, and a cross-host redirect drops `Authorization`.
    # A browser follows the same hop and then gets the 301 below.
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name docs.remo.letii.ru;
    return 301 https://docs.remuka.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name remo.letii.ru;

    ssl_certificate     REPLACE_WITH_CERT_DIR/remo.letii.ru/fullchain.pem;
    ssl_certificate_key REPLACE_WITH_CERT_DIR/remo.letii.ru/privkey.pem;

    server_tokens off;
    client_max_body_size 4m;

    # Metrics are for the machine, not the internet — the same rule as the new host.
    location = /api/metrics {
        return 404;
    }

    # Images embedded in old pages: served as they are for twelve months.
    location = /remo-logo.svg {
        root /srv/remo/apps/web/dist;
        expires 30d;
        add_header Cache-Control "public";
        include /srv/remo/deploy/nginx-security-headers.conf;
        try_files $uri =404;
    }

    # Accounts, organisations, sharing. The trailing slash in proxy_pass strips /api.
    # temporary until 2027-05-22: proxied, then 308 once every client has moved.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:1234/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_hide_header Deprecation;
        proxy_hide_header Link;
        add_header Deprecation "true" always;
        add_header Link '<https://app.remuka.com$request_uri>; rel="successor-version"' always;
        include /srv/remo/deploy/nginx-security-headers.conf;
    }

    # MCP clients keep the old endpoint until they are reconfigured.
    # temporary until 2027-05-22: proxied, then 308 once every client has moved.
    location ^~ /mcp {
        proxy_pass http://127.0.0.1:1234;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_hide_header Deprecation;
        proxy_hide_header Link;
        add_header Deprecation "true" always;
        add_header Link '<https://app.remuka.com$request_uri>; rel="successor-version"' always;
        include /srv/remo/deploy/nginx-security-headers.conf;
    }

    # The live document: /sync/<room>. Proxied for the transition, then the
    # service answers a retired origin with `4001 moved` and the client reloads.
    # temporary until 2027-05-22: proxied, then 308/4001 once every client has moved.
    location ^~ /sync/ {
        proxy_pass http://127.0.0.1:1234/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header Deprecation;
        proxy_hide_header Link;
        add_header Deprecation "true" always;
        add_header Link '<https://app.remuka.com$request_uri>; rel="successor-version"' always;
        include /srv/remo/deploy/nginx-security-headers.conf;
    }

    # Everything else is a page: 301 with the path and query untouched.
    location / {
        return 301 https://app.remuka.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.remo.letii.ru;

    ssl_certificate     REPLACE_WITH_CERT_DIR/docs.remo.letii.ru/fullchain.pem;
    ssl_certificate_key REPLACE_WITH_CERT_DIR/docs.remo.letii.ru/privkey.pem;

    server_tokens off;
    include /srv/remo/deploy/nginx-security-headers-docs.conf;

    # The guide keeps its paths: /guide/ru/… and /guide/en/… only change the host.
    return 301 https://docs.remuka.com$request_uri;
}
