<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ремука — новая пустая комната</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#fbf3df}
a{color:#174a96}a:hover{color:#1e2136}
.rk-card{transition:transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease}
.rk-card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #1e2136 !important}
.rk-press:active{transform:translate(3px,3px);box-shadow:0 0 0 #1e2136 !important}
@keyframes rkFloatA{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(-3deg)}}
@keyframes rkFloatB{0%,100%{transform:translateY(0) rotate(8deg)}50%{transform:translateY(-14px) rotate(4deg)}}
@keyframes rkFloatC{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="height: 100vh; min-height: 820px; display: flex; flex-direction: column; background: #fbf3df; color: #1e2136; font-family: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.5">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding: 10px 18px; background: #ffffff; border-bottom: 1.5px solid #1e2136">
<div style="display: flex; align-items: center; gap: 14px">
<a href="App-Home.dc.html" aria-label="Ремука, на главную" style="display: flex"><svg width="26" height="26" viewBox="0 0 200 200" aria-hidden="true"><circle cx="53" cy="48" r="37" fill="#ff8a57"></circle><rect x="111" y="12" width="72" height="72" rx="12" fill="#78b4ff"></rect><path d="M30.02,106 H169.98 A12,12 0 0 1 181.81,120.03 A83,83 0 0 1 18.19,120.03 A12,12 0 0 1 30.02,106 Z" fill="#3f4256"></path></svg></a>
<label style="display: flex; flex-direction: column">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Название комнаты</span>
<input type="text" value="Новая комната" style="min-height: 36px; border: 1.5px dashed transparent; border-radius: 8px; padding: 2px 8px; background: transparent; font-family: inherit; font-size: 17px; font-weight: 700; color: #1e2136">
</label>
</div>
<a href="App-Invite.dc.html" class="rk-press" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; box-sizing: border-box; padding: 8px 16px; border-radius: 12px; background: #ff8a57; color: #1e2136; border: 1.5px solid #1e2136; box-shadow: 3px 3px 0 #1e2136; text-decoration: none; font-weight: 700; font-size: 15px">Позвать</a>
</header>

<main style="flex: 1 1 auto; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 32px; background-color: #fbf3df; background-image: radial-gradient(#d8c79e 1.3px, transparent 1.3px); background-size: 24px 24px">

<div style="width: 100%; max-width: 860px; display: flex; flex-direction: column; align-items: center; gap: 30px; text-align: center">

<div aria-hidden="true" style="position: relative; width: 300px; height: 180px">
<span style="position: absolute; left: 34px; top: 30px; width: 96px; height: 96px; border-radius: 999px; background: #ff8a57; border: 1.5px solid #1e2136; animation: rkFloatA 5.5s ease-in-out infinite"></span>
<span style="position: absolute; left: 160px; top: 10px; width: 96px; height: 96px; border-radius: 18px; background: #78b4ff; border: 1.5px solid #1e2136; animation: rkFloatB 6.5s ease-in-out infinite"></span>
<span style="position: absolute; left: 70px; top: 104px; width: 170px; height: 70px; border-radius: 0 0 170px 170px; background: #1e2136; animation: rkFloatC 4.5s ease-in-out infinite"></span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; align-items: center">
<h1 style="margin: 0; font-size: clamp(34px, 4.4vw, 52px); line-height: 1.04; font-weight: 800; letter-spacing: -0.035em">{{ head1 }} <span style="position: relative; display: inline-block; z-index: 0">{{ head2 }}<svg aria-hidden="true" viewBox="0 0 300 30" preserveAspectRatio="none" style="position: absolute; left: -8%; bottom: -0.04em; width: 116%; height: 0.36em; z-index: -1"><path d="M4 20 C 60 6, 140 4, 296 14 L 294 26 C 170 18, 80 20, 6 28 Z" fill="#f2b94a"></path></svg></span></h1>
<p style="margin: 0; font-size: 19px; color: #3f4256; max-width: 560px">{{ sub }}</p>
<button type="button" onClick="{{ nextVisit }}" style="margin-top: 6px; min-height: 34px; padding: 2px 12px; border: 1.5px dashed #bca996; border-radius: 10px; background: transparent; font-family: inherit; font-size: 13px; color: #3f4256; cursor: pointer">Вариант {{ n }} из 3 · показать следующий визит</button>
</div>

<div style="width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 18px; text-align: left">
<button type="button" class="rk-card" style="display: flex; flex-direction: column; gap: 10px; padding: 18px; font-family: inherit; color: #1e2136; text-align: left; background: #ffffff; border: 1.5px solid #1e2136; border-radius: 18px; box-shadow: 4px 4px 0 #1e2136; cursor: pointer">
<span style="width: 40px; height: 40px; border-radius: 10px; background: #f2b94a; border: 1.5px solid #1e2136; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e2136" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v11l-5 5H4z"></path><path d="M15 20v-5h5"></path></svg></span>
<strong style="font-size: 17px">Первый стикер</strong>
<span style="font-size: 14px; color: #3f4256">Просто напишите мысль. Порядок наведём потом.</span>
</button>
<a href="App-Home.dc.html" class="rk-card" style="display: flex; flex-direction: column; gap: 10px; padding: 18px; color: #1e2136; text-decoration: none; background: #ffffff; border: 1.5px solid #1e2136; border-radius: 18px; box-shadow: 4px 4px 0 #1e2136">
<span style="width: 40px; height: 40px; border-radius: 10px; background: #c8e8d4; border: 1.5px solid #1e2136; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e2136" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 5h7v6H4zM13 5h7v6h-7zM4 13h7v6H4zM13 13h7v6h-7z"></path></svg></span>
<strong style="font-size: 17px">Взять шаблон</strong>
<span style="font-size: 14px; color: #3f4256">Ретро, канбан, схема процесса — уже разложены.</span>
</a>
<button type="button" class="rk-card" style="display: flex; flex-direction: column; gap: 10px; padding: 18px; font-family: inherit; color: #1e2136; text-align: left; background: #ffffff; border: 2px dashed #8a35d6; border-radius: 18px; box-shadow: 4px 4px 0 #8a35d6; cursor: pointer">
<span style="width: 40px; height: 40px; border-radius: 10px; background: #f3e8ff; border: 1.5px solid #8a35d6; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a35d6" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"></path></svg></span>
<strong style="font-size: 17px">Попросить агента</strong>
<span style="font-size: 14px; color: #3f4256">Вставьте бриф — он предложит план. Применять или нет, решаете вы.</span>
</button>
</div>

<p style="margin: 0; display: inline-flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; font-size: 15px; color: #3f4256">Вместе веселее:
<a href="App-Invite.dc.html" style="font-weight: 700">позовите коллег</a> — они увидят ваш курсор и стикеры сразу.</p>
</div>

<div aria-hidden="true" style="position: absolute; left: 14%; top: 22%; display: flex; align-items: flex-start; transform: rotate(-4deg)">
<span style="padding: 10px 14px; background: #ff8fbd; border-radius: 3px; font-size: 14px; font-weight: 600; box-shadow: 0 12px 10px -8px rgba(38,30,22,.45)">Двойной клик = стикер</span>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { v: 0 };
  }
  renderVals() {
    var self = this;
    var variants = [
      ['Здесь пока', 'тихо', 'Кликните дважды в любом месте — появится стикер. Или начните с одного из способов ниже.'],
      ['Чистый лист —', 'лучший старт', 'Бросьте первую мысль на стол. Порядок наведём потом — с шаблоном или агентом.'],
      ['Комната ждёт', 'людей', 'Позовите коллег — они увидят ваш курсор сразу. А пока — первый стикер двойным кликом.']
    ];
    var v = variants[this.state.v];
    return { head1: v[0], head2: v[1], sub: v[2], n: this.state.v + 1, nextVisit: function () { self.setState({ v: (self.state.v + 1) % 3 }); } };
  }
}
</script>
</body>
</html>
