<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ремука — тулбар и панели выделения</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#fbf3df}
a{color:#174a96}a:hover{color:#1e2136}
.rk-b:hover{background:#fbf3df}
.rk-sw:hover{transform:scale(1.08)}
@keyframes rkIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="min-height: 100vh; background: #fbf3df; color: #1e2136; font-family: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.45; padding: 36px 24px 48px; box-sizing: border-box">
<div style="max-width: 1360px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">

<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 760px">
<h1 style="margin: 0; font-size: 44px; line-height: 1.05; font-weight: 800; letter-spacing: -0.035em">Инструменты — <span style="position: relative; display: inline-block; z-index: 0">под рукой<svg aria-hidden="true" viewBox="0 0 300 30" preserveAspectRatio="none" style="position: absolute; left: -4%; bottom: -0.04em; width: 108%; height: 0.36em; z-index: -1"><path d="M4 20 C 60 6, 140 4, 296 14 L 294 26 C 170 18, 80 20, 6 28 Z" fill="#f2b94a"></path></svg></span></h1>
<p style="margin: 0; font-size: 18px; color: #3f4256">Тулбар: 7 инструментов и «Ещё». У выделенного объекта — своя планка: не больше 7 кнопок и «⋯». Всё остальное — в «⋯», контекстном меню и ⌘K.</p>
</div>
<div role="tablist" aria-label="Что выделено" style="display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; background: #ffffff; border: 1.5px solid #1e2136; border-radius: 14px; box-shadow: 3px 3px 0 #1e2136">
<sc-for list="{{ kinds }}" as="k" hint-placeholder-count="5">
<button type="button" role="tab" aria-selected="{{ k.sel }}" onClick="{{ k.pick }}" style="{{ k.style }}">{{ k.label }}</button>
</sc-for>
</div>
</header>

<main aria-label="Комната" style="position: relative; height: 760px; border: 1.5px solid #1e2136; border-radius: 22px; box-shadow: 8px 8px 0 #1e2136; overflow: hidden; background-color: #fbf3df; background-image: radial-gradient(#d8c79e 1.3px, transparent 1.3px); background-size: 24px 24px">

<nav aria-label="Инструменты" style="position: absolute; left: 18px; top: 50%; transform: translateY(-50%); z-index: 4; display: flex; flex-direction: column; gap: 4px; padding: 8px; background: #ffffff; border: 1.5px solid #1e2136; border-radius: 16px; box-shadow: 3px 3px 0 #1e2136">
<sc-for list="{{ tools }}" as="t" hint-placeholder-count="8">
<button type="button" aria-label="{{ t.label }}" aria-pressed="{{ t.pressed }}" onClick="{{ t.pick }}" onDoubleClick="{{ t.lock }}" class="rk-b" style="{{ t.style }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e2136" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.d }}"></path></svg><sc-if value="{{ t.locked }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; right: -4px; bottom: -4px; width: 16px; height: 16px; border-radius: 5px; background: #1e2136; display: grid; place-items: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"><path d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z"></path></svg></span></sc-if></button>
</sc-for>
<span aria-hidden="true" style="height: 1.5px; background: #e6dcc4; margin: 4px 6px"></span>
<button type="button" aria-label="Отменить" class="rk-b" style="width: 44px; height: 40px; border: none; border-radius: 10px; background: transparent; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1e2136" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ undo }}"></path></svg></button>
<button type="button" aria-label="Повторить" class="rk-b" style="width: 44px; height: 40px; border: none; border-radius: 10px; background: transparent; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8781" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ redo }}"></path></svg></button>
</nav>

<sc-if value="{{ flyoutOpen }}" hint-placeholder-val="{{ true }}">
<div role="menu" aria-label="{{ flyoutTitle }}" style="{{ flyoutStyle }}">
<div style="font-size: 13px; font-weight: 700; color: #3f4256; padding: 2px 4px 8px">{{ flyoutTitle }}</div>
<div style="{{ flyoutGrid }}">
<sc-for list="{{ flyout }}" as="f" hint-placeholder-count="7">
<button type="button" role="menuitem" aria-label="{{ f.label }}" class="rk-b" style="{{ f.style }}">
<sc-if value="{{ f.isSwatch }}" hint-placeholder-val="{{ false }}"><span style="{{ f.swatch }}"></span></sc-if>
<sc-if value="{{ f.isIcon }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e2136" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ f.d }}"></path></svg></sc-if>
<sc-if value="{{ f.hasText }}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px">{{ f.label }}</span></sc-if>
</button>
</sc-for>
</div>
<sc-if value="{{ flyoutNote }}" hint-placeholder-val="{{ false }}"><p style="margin: 8px 4px 0; font-size: 12px; color: #3f4256">{{ flyoutNoteText }}</p></sc-if>
</div>
</sc-if>

<div aria-hidden="true" style="{{ objStyle }}">{{ objText }}</div>
<sc-if value="{{ isConnector }}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="700" height="260" style="position: absolute; left: 380px; top: 300px; overflow: visible">
<defs><marker id="h1" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M2 2.2 L10.2 6 L2 9.8 Q1.2 6 2 2.2 Z" fill="#1e2136" stroke="#1e2136" stroke-width="1.2" stroke-linejoin="round"></path></marker></defs>
<rect x="0" y="60" width="160" height="90" rx="10" fill="#fffdf8" stroke="#1e2136" stroke-width="2"></rect>
<rect x="470" y="120" width="160" height="90" rx="10" fill="#cddff8" stroke="#1e2136" stroke-width="2"></rect>
<path d="M160 105 C 300 105, 330 165, 466 165" fill="none" stroke="#1e2136" stroke-width="3" stroke-linecap="round" marker-end="url(#h1)"></path>
<circle cx="313" cy="135" r="6" fill="#ffffff" stroke="#1e2136" stroke-width="1.5"></circle>
</svg>
</sc-if>

<div role="toolbar" aria-label="{{ barLabel }}" style="{{ barStyle }}">
<sc-for list="{{ bar }}" as="b" hint-placeholder-count="7">
<sc-if value="{{ b.sep }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 1.5px; height: 24px; background: #e6dcc4; margin: 0 2px"></span></sc-if>
<sc-if value="{{ b.btn }}" hint-placeholder-val="{{ true }}">
<button type="button" aria-label="{{ b.label }}" title="{{ b.label }}" class="rk-b" style="{{ b.style }}">
<sc-if value="{{ b.swatch }}" hint-placeholder-val="{{ false }}"><span style="{{ b.swatchStyle }}"></span></sc-if>
<sc-if value="{{ b.icon }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1e2136" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ b.d }}"></path></svg></sc-if>
<sc-if value="{{ b.word }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 700">{{ b.text }}</span></sc-if>
</button>
</sc-if>
</sc-for>
</div>

<div style="position: absolute; right: 22px; bottom: 22px; width: 320px; padding: 12px 14px; background: #ffffff; border: 1.5px solid #1e2136; border-radius: 14px; box-shadow: 3px 3px 0 #1e2136; font-size: 13px; display: flex; flex-direction: column; gap: 6px">
<strong style="font-size: 14px">«⋯» у {{ kindGen }}</strong>
<sc-for list="{{ moreList }}" as="m" hint-placeholder-count="4"><span style="color: #3f4256">· {{ m }}</span></sc-for>
</div>
</main>

<section aria-labelledby="rules-h" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 14px">
<h2 id="rules-h" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Правила</h2>
<sc-for list="{{ rules }}" as="r" hint-placeholder-count="4">
<div style="padding: 14px 16px; background: #ffffff; border: 1.5px solid #1e2136; border-radius: 16px; box-shadow: 3px 3px 0 #1e2136; display: flex; flex-direction: column; gap: 4px"><strong>{{ r.t }}</strong><span style="color: #3f4256; font-size: 14px">{{ r.d }}</span></div>
</sc-for>
</section>
</div>
</div>
</x-dc>
